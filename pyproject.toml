[project]
name = "youtube-fe"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.127.0",
    "yt-dlp>=2025.12.8",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "httpx>=0.28.0",
    "pyright>=1.1.400",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["be/tests"]
pythonpath = ["be"]
asyncio_mode = "auto"

[tool.ruff]
src = ["be"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
target-version = ["py314"]

[tool.pyright]
include = ["be"]
pythonPlatform = "All"
typeCheckingMode = "basic"
